[package]
name = "winfynd-setup"
version = "0.1.1"
description = "WinFynd Setup: installs, updates and uninstalls WinFynd"
edition = "2021"

[features]
# Embed the NSIS installer built by `npm run tauri build`. Without it the binary
# only does uninstall, which is how it ships inside the app as uninstall-ui.exe.
payload = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
