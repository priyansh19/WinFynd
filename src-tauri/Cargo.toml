[package]
name = "winfynd"
version = "0.1.0"
description = "Find anything on your PC by text or voice. Everything stays local."
edition = "2021"

[lib]
name = "winfynd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
