name: Release

# Builds WinFynd Setup on Windows, installs it once to check it works, and publishes it as a
# GitHub release tagged v<version> (the version in src-tauri/tauri.conf.json), with the notes in
# docs/releases/<version>.md.
#
# Publish: merge a new version (with its notes) to main, and the push publishes it if
# v<version> isn't released yet. Actions > Release > Run workflow on main, or pushing a tag like
# v0.1.0, does the same. Runs on other branches build and check the installer without publishing.
# On a pull request that touches the installer it builds and checks it without publishing.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - docs/releases/**
      - src-tauri/tauri.conf.json
  pull_request:
    paths:
      - .github/workflows/release.yml
      - docs/releases/**
      - scripts/build-installer.mjs
      - scripts/fetch-llama.mjs
      - setup/**
      - src-tauri/tauri.conf.json
      - src-tauri/windows/**

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - name: Version, notes and whether it's out already
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json"; exit 1
          fi
          notes="docs/releases/$version.md"
          [ -f "$notes" ] || { echo "::error::Write the release notes in $notes first"; exit 1; }
          released=false
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then released=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "WinFynd $version, released already: $released"

  installer:
    name: WinFynd Setup
    needs: version
    # A push to main only publishes a version that isn't out yet.
    if: github.event_name != 'push' || github.ref_type == 'tag' || needs.version.outputs.released != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            setup

      - name: Build WinFynd Setup
        run: npm run build:installer

      - name: Install it and start WinFynd once
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $setup = "dist-installer/WinFynd-Setup-$env:VERSION.exe"
          $nsis = "src-tauri/target/release/bundle/nsis/WinFynd_$($env:VERSION)_x64-setup.exe"
          foreach ($f in $setup, $nsis) { if (-not (Test-Path $f)) { throw "Missing $f" } }
          if ((Get-Item $setup).Length -le (Get-Item $nsis).Length) {
            throw "WinFynd Setup is smaller than the NSIS installer it should carry"
          }

          # WinFynd Setup runs this same NSIS installer silently.
          $install = Start-Process $nsis -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The NSIS installer failed with exit code $($install.ExitCode)" }

          # The Apps entry WinFynd Setup reads to find, update and uninstall WinFynd.
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WinFynd'
          if ($entry.DisplayVersion -ne $env:VERSION) { throw "Apps lists version $($entry.DisplayVersion), not $env:VERSION" }
          if ($entry.UninstallString -notmatch 'uninstall-ui\.exe') { throw "Apps doesn't open the WinFynd uninstall window: $($entry.UninstallString)" }
          $dir = $entry.InstallLocation.Trim().Trim('"')
          $binary = if ($entry.MainBinaryName) { $entry.MainBinaryName } else { 'WinFynd.exe' }
          Get-ChildItem $dir | Format-Table Name, Length
          $llama = Join-Path $dir 'llama\llama-server.exe'
          foreach ($f in (Join-Path $dir $binary), (Join-Path $dir 'uninstall-ui.exe'), $llama) {
            if (-not (Test-Path $f)) { throw "The installer didn't put $f in place" }
          }
          # The engine that runs the search model has to start from where it's installed, DLLs and all.
          $out = & $llama --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "llama-server didn't start: $out" }
          Write-Host "llama-server: $($out.Trim())"

          # Started the way it starts at sign-in, it should stay running in the tray. (If the
          # installer already started it, this second copy hands over to it and exits.)
          Start-Process (Join-Path $dir $binary) -ArgumentList '--background'
          Start-Sleep -Seconds 20
          $running = Get-Process -Name ([IO.Path]::GetFileNameWithoutExtension($binary)) -ErrorAction SilentlyContinue
          if (-not $running) { throw "WinFynd isn't running 20 seconds after it started" }
          $running | Stop-Process -Force
          Write-Host "WinFynd $env:VERSION installed to $dir and kept running."

      - name: Checksum
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $name = "WinFynd-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash "dist-installer/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii dist-installer/SHA256SUMS.txt
          Get-Content dist-installer/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WinFynd-Setup-${{ needs.version.outputs.version }}
          path: |
            dist-installer/WinFynd-Setup-${{ needs.version.outputs.version }}.exe
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WinFynd ${{ needs.version.outputs.version }}
          body_path: ${{ needs.version.outputs.notes }}
          files: |
            dist-installer/WinFynd-Setup-${{ needs.version.outputs.version }}.exe
            dist-installer/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
